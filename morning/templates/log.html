<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basecamp — Morning Log</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 2rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    form {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }

    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .field label span.val {
      color: #e2e8f0;
      font-weight: 600;
      min-width: 1.4rem;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1e293b;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #3b82f6;
      border: none;
      cursor: pointer;
    }

    textarea {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9rem;
      min-height: 80px;
      padding: 0.7rem;
      resize: vertical;
      width: 100%;
    }

    textarea::placeholder { color: #475569; }
    textarea:focus { outline: none; border-color: #3b82f6; }

    button[type="submit"] {
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem;
      transition: background 0.15s;
    }

    button[type="submit"]:hover { background: #2563eb; }
    button[type="submit"]:active { background: #1d4ed8; }

    #status {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: #4ade80;
      text-align: center;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Morning Log</h1>

  <form id="log-form">
    <div class="field">
      <label>Recovery <span class="val" id="v-recovery">5</span></label>
      <input type="range" id="recovery" name="recovery" min="1" max="10" value="5" />
    </div>

    <div class="field">
      <label>Energy <span class="val" id="v-energy">5</span></label>
      <input type="range" id="energy" name="energy" min="1" max="10" value="5" />
    </div>

    <div class="field">
      <label>Clarity <span class="val" id="v-clarity">5</span></label>
      <input type="range" id="clarity" name="clarity" min="1" max="10" value="5" />
    </div>

    <div class="field">
      <label>Mood <span class="val" id="v-mood">5</span></label>
      <input type="range" id="mood" name="mood" min="1" max="10" value="5" />
    </div>

    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="notes" name="notes" placeholder="Anything to note about last night…"></textarea>
    </div>

    <button type="submit">Submit</button>
    <p id="status"></p>
  </form>

  <script>
    const sliders = ["recovery", "energy", "clarity", "mood"];
    sliders.forEach(id => {
      const el = document.getElementById(id);
      const val = document.getElementById("v-" + id);
      el.addEventListener("input", () => { val.textContent = el.value; });
    });

    document.getElementById("log-form").addEventListener("submit", async e => {
      e.preventDefault();
      const status = document.getElementById("status");
      const payload = {
        recovery: document.getElementById("recovery").value,
        energy:   document.getElementById("energy").value,
        clarity:  document.getElementById("clarity").value,
        mood:     document.getElementById("mood").value,
        notes:    document.getElementById("notes").value,
      };

      try {
        const res = await fetch("/log", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.status === "ok") {
          status.style.color = "#4ade80";
          status.textContent = "Saved — have a good day.";
          document.getElementById("log-form").reset();
          sliders.forEach(id => {
            document.getElementById("v-" + id).textContent = "5";
          });
        } else {
          status.style.color = "#f87171";
          status.textContent = "Error: " + (data.message || "unknown");
        }
      } catch (err) {
        status.style.color = "#f87171";
        status.textContent = "Network error — are you on the local network?";
      }
    });
  </script>
</body>
</html>
